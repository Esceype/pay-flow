name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Cache and rate limiter (a Lua script) are tested against the real
      # thing, same major version as docker-compose.yml.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Credentials of the throwaway service container above — not secrets.
      # DATABASE_URL is needed as early as `npm ci`: its postinstall runs
      # `prisma generate`, and prisma.config.ts resolves the variable.
      # TEST_DATABASE_URL is what the integration tests connect to; they
      # create and migrate that database themselves (test/global-setup.ts).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/payflow_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/payflow_test?schema=public
      TEST_REDIS_URL: redis://localhost:6379
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration

      # The Docker image is built with none of the runtime env vars present
      # (docs/adr/005-lazy-env-and-client-init.md). Building here with the
      # database URL removed keeps that property from regressing unnoticed.
      - name: Build without runtime environment
        run: env -u DATABASE_URL -u TEST_DATABASE_URL npm run build
